                        required
                        value={editingUser ? editingUser.name : newUser.name}
                        onChange={(e) => editingUser ? setEditingUser({ ...editingUser, name: e.target.value }) : setNewUser({ ...newUser, name: e.target.value })}
                        placeholder="Ej. Juan Pérez"
                        className="admin-input"
                      />
                    </label>
                    <label style={{ fontSize: 12.5, color: "#235347", fontWeight: 600, display: "flex", flexDirection: "column", gap: 6 }}>
                      Usuario (Login)
                      <input
                        required
                        value={editingUser ? editingUser.user : newUser.user}
                        onChange={(e) => editingUser ? setEditingUser({ ...editingUser, user: e.target.value }) : setNewUser({ ...newUser, user: e.target.value })}
                        placeholder="Ej. jperez"
                        className="admin-input"
                      />
                    </label>
                    <label style={{ fontSize: 12.5, color: "#235347", fontWeight: 600, display: "flex", flexDirection: "column", gap: 6 }}>
                      Contraseña {editingUser && <span style={{ fontWeight: 400, color: "#8EB69B", fontSize: 11 }}>(Opcional)</span>}
                      <input
                        required={!editingUser}
                        type="password"
                        value={editingUser ? editingUser.pass : newUser.pass}
                        onChange={(e) => editingUser ? setEditingUser({ ...editingUser, pass: e.target.value }) : setNewUser({ ...newUser, pass: e.target.value })}
                        placeholder={editingUser ? "•••••••• (Sin cambios)" : "••••••••"}
                        className="admin-input"
                      />
                    </label>
                    <label style={{ fontSize: 12.5, color: "#235347", fontWeight: 600, display: "flex", flexDirection: "column", gap: 6 }}>
                      Rol / Permisos
                      <select
                        value={editingUser ? editingUser.role : newUser.role}
                        onChange={(e) => editingUser ? setEditingUser({ ...editingUser, role: e.target.value }) : setNewUser({ ...newUser, role: e.target.value })}
                        className="admin-input"
                      >
                        <option value="basico">Personal Básico</option>
                        <option value="admin">Administrador</option>
                      </select>
                    </label>
                    {editingUser ? (
                      <div style={{ gridColumn: "1 / -1", display: "flex", gap: 10 }}>
                        <button
                          type="submit"
                          style={{
                            flex: 1, background: "#0B2B26",
                            color: "#FFF", border: "none", borderRadius: 12, padding: "12px", fontWeight: 600,
                            fontSize: 13.5, cursor: "pointer", display: "flex", alignItems: "center",
                            justifyContent: "center", gap: 6, boxShadow: "0 4px 14px rgba(11, 43, 38, 0.2)"
                          }}
                        >
                          <Save size={16} /> Actualizar Usuario
                        </button>
                        <button
                          type="button"
                          onClick={cancelEditUser}
                          style={{
                            background: "#FFFFFF", color: "#163832", border: "1.5px solid #8EB69B",
                            borderRadius: 12, padding: "12px 18px", fontWeight: 600,
                            fontSize: 13.5, cursor: "pointer", display: "flex", alignItems: "center",
                            justifyContent: "center", gap: 6
                          }}
                        >
                          <X size={16} /> Cancelar
                        </button>
                      </div>
                    ) : (
                      <button
                        type="submit"
                        style={{
                          gridColumn: "1 / -1", background: "#0B2B26",
                          color: "#FFF", border: "none", borderRadius: 12, padding: "12px", fontWeight: 600,
                          fontSize: 13.5, cursor: "pointer", display: "flex", alignItems: "center",
                          justifyContent: "center", gap: 6, boxShadow: "0 4px 14px rgba(11, 43, 38, 0.2)"
                        }}
                      >
                        <Plus size={16} /> Guardar Usuario
                      </button>
                    )}
                  </form>
                </div>

                <h2 className="heading-fine" style={{ fontSize: 16, marginBottom: 14 }}>Personal Registrado</h2>
                <div className="table-scroll">
                  <table className="cat-table">
                    <thead>
                      <tr>
                        <th>NOMBRE</th>
                        <th>USUARIO</th>
                        <th>CONTRASEÑA</th>
                        <th>ROL</th>
                        <th>ESTADO DE SEGURIDAD</th>
                        <th>ACCIÓN</th>
                      </tr>
                    </thead>
                    <tbody>
                      {users.map((u, i) => {
                        const secInfo = authSecurityMap[u.user];
                        const isLocked = secInfo?.lockedUntil && Date.now() < secInfo.lockedUntil;
                        const remainingMin = isLocked ? Math.ceil((secInfo.lockedUntil - Date.now()) / 60000) : 0;
                        const isEditingThis = editingUser?.originalUser === u.user;
                        return (
                          <tr key={i} style={isEditingThis ? { background: "rgba(218, 241, 222, 0.4)" } : undefined}>
                            <td style={{ fontWeight: 600, color: "#051F20" }}>{u.name}</td>
                            <td><code style={{ background: "#DAF1DE", padding: "2px 6px", borderRadius: 4, color: "#0B2B26", fontSize: 12 }}>{u.user}</code></td>
                            <td style={{ color: "#8EB69B" }} title="Hasheado criptográficamente (SHA-256 + Salt)">
                              <span style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11, background: "#F4F1EC", padding: "2px 6px", borderRadius: 4, color: "#235347" }}>
                                <Lock size={11} /> SHA-256
                              </span>
                            </td>
                            <td>
                              <span style={{
                                background: u.role === "admin" ? "#DAF1DE" : "#FFFFFF",
                                color: u.role === "admin" ? "#0B2B26" : "#235347",
                                padding: "3px 8px", borderRadius: 12, fontSize: 10.5, fontWeight: 700,
                                border: `1px solid ${u.role === "admin" ? "#8EB69B" : "#DAF1DE"}`
                              }}>
                                {u.role.toUpperCase()}
                              </span>
                            </td>
                            <td>
                              {isLocked ? (
                                <span style={{
                                  background: "#FEE2E2", color: "#B91C1C",
                                  padding: "3px 8px", borderRadius: 12, fontSize: 10.5, fontWeight: 700,
                                  border: "1px solid #FCA5A5", display: "inline-flex", alignItems: "center", gap: 4
                                }}>
                                  <ShieldAlert size={12} /> Bloqueado ({remainingMin}m)
                                </span>
                              ) : (
                                <span style={{
                                  background: "#DAF1DE", color: "#0B2B26",
                                  padding: "3px 8px", borderRadius: 12, fontSize: 10.5, fontWeight: 700,
                                  border: "1px solid #8EB69B", display: "inline-flex", alignItems: "center", gap: 4
                                }}>
                                  <ShieldCheck size={12} /> Activo
                                </span>
                              )}
                            </td>
                            <td>
                              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                                <button
                                  onClick={() => startEditUser(u)}
                                  style={{
                                    background: isEditingThis ? "#8EB69B" : "#DAF1DE",
                                    border: "none", color: "#0B2B26", borderRadius: 6, cursor: "pointer",
                                    padding: "5px 8px", display: "inline-flex", alignItems: "center", justifyContent: "center",
                                    transition: "all 0.2s"
                                  }}
                                  title="Editar usuario"
                                >
                                  <Pencil size={14} />
                                </button>
                                {isLocked && (
                                  <button
                                    onClick={() => handleUnlockUser(u.user)}
                                    style={{
                                      background: "#DAF1DE", border: "1px solid #8EB69B",
                                      color: "#0B2B26", borderRadius: 6, cursor: "pointer",
                                      padding: "4px 8px", fontSize: 11.5, fontWeight: 600,
                                      display: "inline-flex", alignItems: "center", gap: 4
                                    }}
                                    title="Desbloquear cuenta de usuario"
                                  >
                                    <Unlock size={13} /> Desbloquear
                                  </button>
                                )}
                                <button
                                  onClick={() => handleDeleteUser(u.user)}
                                  style={{ background: "#FEE2E2", border: "none", color: "#EF4444", borderRadius: 6, cursor: "pointer", padding: "5px 8px" }}
                                  title="Eliminar usuario"
                                >
                                  <Trash2 size={14} />
                                </button>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* ========================================================================= */}
            {/* PANTALLA SELECCIÓN DE ÁREA LOGÍSTICA ELEGANTE */}
            {/* ========================================================================= */}
            {screen === "logistica" && (
              <div style={{ width: "100%", maxWidth: 900, marginTop: 10 }}>
                <button
                  onClick={() => safeSetScreen("hub")}
                  style={{
                    background: "#FFFFFF", border: "1.5px solid #8EB69B",
                    borderRadius: 10, padding: "7px 12px", color: "#163832", display: "inline-flex",
                    alignItems: "center", gap: 6, cursor: "pointer", marginBottom: 18, fontSize: 12.5, fontWeight: 600
                  }}
                >
                  <ArrowLeft size={15} /> Volver al Inicio
                </button>
                <h1 className="heading-fine" style={{ fontSize: 26, margin: "0 0 20px" }}>
                  Logística · Selecciona un Área
                </h1>
                <div className="area-grid">
                  {Object.entries(LOGISTICA_AREAS).map(([key, info]) => {
                    const Icon = info.icon;
                    const count = (catalogByArea[key] || []).length;
                    return (
                      <button
                        key={key}
                        onClick={() => pickArea(key)}
                        className="glass-card"
                        style={{
                          display: "flex", alignItems: "center", gap: 16, padding: "20px 22px",
                          color: "#051F20", border: "1.5px solid rgba(142, 182, 155, 0.4)",
                          borderRadius: "18px", textAlign: "left", background: "#FFFFFF"
                        }}
                      >
                        <div style={{
                          width: 48, height: 48, borderRadius: 14, background: info.accentSoft,
                          display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
                          border: "1px solid #8EB69B"
                        }}>
                          <Icon size={24} color={info.accent} />
                        </div>
                        <div>
                          <div className="heading-fine" style={{ fontSize: 19 }}>
                            {info.label}
                          </div>
                          <div style={{ fontSize: 12.5, color: "#235347", marginTop: 2, fontWeight: 500 }}>
                            {count > 0 ? `${count} productos configurados` : "Catálogo disponible"}
                          </div>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ========================================================================= */}
            {/* PANTALLA ADMINISTRAR CATALOGO LOGISTICA ELEGANTE */}
            {/* ========================================================================= */}
            {screen === "logCatalogo" && areaInfo && authedUser && (
              <div style={{ width: "100%", maxWidth: 920, marginTop: 10 }}>
                <button
                  onClick={() => safeSetScreen("logForm")}
                  style={{
                    background: "#FFFFFF", border: "1.5px solid #8EB69B",
                    borderRadius: 10, padding: "7px 12px", color: "#163832", display: "inline-flex",
                    alignItems: "center", gap: 6, cursor: "pointer", marginBottom: 18, fontSize: 12.5, fontWeight: 600
                  }}
                >
                  <ArrowLeft size={15} /> Volver al Requerimiento
                </button>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 18 }}>
                  <div style={{ width: 6, height: 26, background: areaInfo.accent, borderRadius: 3 }} />
                  <div>
                    <h1 className="heading-fine" style={{ fontSize: 24, margin: 0 }}>
                      {isTransformation ? "Productos A / B · Transformación" : `Catálogo · ${areaInfo.label}`}
                    </h1>
                  </div>
                </div>

                {catalogToast && (
                  <div style={{ background: "#DAF1DE", border: "1.5px solid #8EB69B", color: "#0B2B26", borderRadius: 12, padding: "12px 16px", marginBottom: 18, fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 8, boxShadow: "0 4px 12px rgba(11,43,38,0.08)" }}>
                    <CheckCircle2 size={18} color="#0B2B26" /> {catalogToast}
                  </div>
                )}

                {isTransformation ? (
                  <div>
                    {isAdmin && (
                      <button onClick={startAddTransformProduct} style={{ display: "flex", alignItems: "center", gap: 6, background: areaInfo.accent, color: "#FFF", border: "none", borderRadius: 10, padding: "10px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer", marginBottom: 18 }}>
                        <Plus size={16} /> Agregar Producto
                      </button>
                    )}

                    {editingTransformId && transformDraft && (
                      <div className="glass-card" style={{ border: `1.5px solid ${areaInfo.accent}`, padding: 20, marginBottom: 20 }}>
                        <h3 className="heading-fine" style={{ margin: "0 0 14px", fontSize: 15 }}>
                          {editingTransformId === "new" ? "Nuevo Producto" : "Editar Producto"}
                        </h3>
                        <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr 1fr", gap: 12, marginBottom: 16 }}>
                          <label style={{ fontSize: 12, color: "#235347", fontWeight: 600, display: "flex", flexDirection: "column", gap: 4 }}>
                            Uso
                            <select className="admin-input" value={transformDraft.type} onChange={(e) => setTransformDraft({ ...transformDraft, type: e.target.value })}>
                              <option value="A">PRODUCTO A (Origen)</option>
                              <option value="B">PRODUCTO B (Transformado)</option>
                              <option value="BOTH">AMBOS (A y B)</option>
                            </select>
                          </label>
                          <label style={{ fontSize: 12, color: "#235347", fontWeight: 600, display: "flex", flexDirection: "column", gap: 4 }}>
                            Nombre
                            <input className="admin-input" value={transformDraft.name} onChange={(e) => setTransformDraft({ ...transformDraft, name: e.target.value })} placeholder="Ej. LOMO FINO PREMIUM" />
                          </label>
                          <label style={{ fontSize: 12, color: "#235347", fontWeight: 600, display: "flex", flexDirection: "column", gap: 4 }}>
                            Medida
                            <input className="admin-input" value={transformDraft.unit} onChange={(e) => setTransformDraft({ ...transformDraft, unit: e.target.value })} placeholder="Ej. kg, ud" />
                          </label>
                        </div>
                        <div style={{ display: "flex", gap: 10 }}>
                          <button onClick={saveTransformProduct} style={{ display: "flex", alignItems: "center", gap: 6, background: areaInfo.accent, color: "#FFF", border: "none", borderRadius: 8, padding: "8px 14px", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
                            <Save size={14} /> Guardar
                          </button>
                          <button onClick={() => { setEditingTransformId(null); setTransformDraft({ id: null, type: "A", name: "", unit: "kg" }); }} style={{ display: "flex", alignItems: "center", gap: 6, background: "#FFFFFF", border: "1px solid #8EB69B", color: "#235347", borderRadius: 8, padding: "8px 14px", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
                            <X size={14} /> Cancelar
                          </button>
                        </div>
                      </div>
                    )}

                    <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
                      <button onClick={() => setTransformFilterTab("all")} style={{ background: transformFilterTab === "all" ? areaInfo.accent : "#FFFFFF", color: transformFilterTab === "all" ? "#FFF" : "#235347", border: "1px solid #8EB69B", borderRadius: 16, padding: "6px 14px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
                        Todos ({transformOptions.length})
                      </button>
                      <button onClick={() => setTransformFilterTab("A")} style={{ background: transformFilterTab === "A" ? "#0B2B26" : "#FFFFFF", color: transformFilterTab === "A" ? "#FFF" : "#235347", border: "1px solid #8EB69B", borderRadius: 16, padding: "6px 14px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
                        Producto A ({optionsA.length})
                      </button>
                      <button onClick={() => setTransformFilterTab("B")} style={{ background: transformFilterTab === "B" ? "#235347" : "#FFFFFF", color: transformFilterTab === "B" ? "#FFF" : "#235347", border: "1px solid #8EB69B", borderRadius: 16, padding: "6px 14px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
                        Producto B ({optionsB.length})
                      </button>
                    </div>

                    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 12 }}>
                      {transformOptions.filter(it => transformFilterTab === "all" || it.type === transformFilterTab || it.type === "BOTH").map((it) => (
                        <div key={it.id} className="glass-card" style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 16px", borderRadius: 14 }}>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontSize: 13.5, fontWeight: 600, color: "#051F20" }}>{it.name}</div>
                            <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 4 }}>
                              <span style={{ background: "#DAF1DE", padding: "2px 6px", borderRadius: 4, fontSize: 10.5, fontWeight: 600, color: "#0B2B26" }}>
                                {it.unit}
                              </span>
                              <span style={{
                                background: it.type === "A" ? "#DAF1DE" : (it.type === "B" ? "#DAF1DE" : "#DAF1DE"),
                                color: it.type === "A" ? "#0B2B26" : (it.type === "B" ? "#163832" : "#235347"),
                                padding: "2px 6px", borderRadius: 4, fontSize: 10, fontWeight: 700, border: "1px solid #8EB69B"
                              }}>
                                {it.type === "A" ? "ORIGEN (A)" : (it.type === "B" ? "TRANSFORMADO (B)" : "A y B")}
                              </span>
                            </div>
                          </div>
                          {isAdmin && (
                            <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                              <button title="Editar" onClick={() => startEditTransformProduct(it)} style={{ background: "#DAF1DE", border: "none", color: "#0B2B26", cursor: "pointer", padding: 6, borderRadius: 6 }}>
                                <Pencil size={14} />
                              </button>
                              <button title="Eliminar" onClick={() => deleteTransformProduct(it.id)} style={{ background: "#FEE2E2", border: "none", color: "#EF4444", cursor: "pointer", padding: 6, borderRadius: 6 }}>
                                <Trash2 size={14} />
                              </button>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                ) : (
                  <div>
                    <button onClick={startAddProduct} style={{ display: "flex", alignItems: "center", gap: 6, background: areaInfo.accent, color: "#FFF", border: "none", borderRadius: 10, padding: "10px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer", marginBottom: 18 }}>
                      <Plus size={16} /> Agregar Producto
                    </button>
                    {editingId && draft && (
                      <div className="glass-card" style={{ border: `1.5px solid ${areaInfo.accent}`, padding: 20, marginBottom: 20 }}>
                        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 16 }}>
                          <label style={{ fontSize: 12, color: "#235347", fontWeight: 600, display: "flex", flexDirection: "column", gap: 4 }}>
                            Categoría
                            <input list="cat-list" className="admin-input" value={draft.c} onChange={(e) => setDraft({ ...draft, c: e.target.value })} />
                            <datalist id="cat-list">
                              {uniqueCategories.map(c => <option key={c} value={c} />)}
                            </datalist>
                          </label>
                          <label style={{ fontSize: 12, color: "#235347", fontWeight: 600, display: "flex", flexDirection: "column", gap: 4 }}>Producto<input className="admin-input" value={draft.p} onChange={(e) => setDraft({ ...draft, p: e.target.value })} /></label>
                          <label style={{ fontSize: 12, color: "#235347", fontWeight: 600, display: "flex", flexDirection: "column", gap: 4 }}>Base 1<input className="admin-input" type="text" inputMode="decimal" pattern="[0-9.]*" value={draft.b1} onChange={(e) => setDraft({ ...draft, b1: e.target.value })} placeholder="0" /></label>
                          <label style={{ fontSize: 12, color: "#235347", fontWeight: 600, display: "flex", flexDirection: "column", gap: 4 }}>Base 2<input className="admin-input" type="text" inputMode="decimal" pattern="[0-9.]*" value={draft.b2} onChange={(e) => setDraft({ ...draft, b2: e.target.value })} placeholder="0" /></label>
                          <label style={{ fontSize: 12, color: "#235347", fontWeight: 600, display: "flex", flexDirection: "column", gap: 4 }}>{areaInfo.unidLabel}<input className="admin-input" value={draft.u} onChange={(e) => setDraft({ ...draft, u: e.target.value })} /></label>
                          {areaInfo.hasFrecuencia && <label style={{ fontSize: 12, color: "#235347", fontWeight: 600, display: "flex", flexDirection: "column", gap: 4 }}>Frecuencia<input className="admin-input" value={draft.f} onChange={(e) => setDraft({ ...draft, f: e.target.value })} /></label>}
                        </div>
                        <div style={{ display: "flex", gap: 10 }}>
                          <button onClick={saveDraft} style={{ display: "flex", alignItems: "center", gap: 6, background: areaInfo.accent, color: "#FFF", border: "none", borderRadius: 8, padding: "8px 14px", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}><Save size={14} /> Guardar</button>
                          <button onClick={() => { setEditingId(null); setDraft(null); }} style={{ display: "flex", alignItems: "center", gap: 6, background: "#FFFFFF", border: "1px solid #8EB69B", color: "#235347", borderRadius: 8, padding: "8px 14px", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}><X size={14} /> Cancelar</button>
                        </div>
                      </div>
                    )}
                    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                      {catalog.map((it, idx) => (
                        <div key={it.id || idx} className="glass-card" style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 16px", borderRadius: 14 }}>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontSize: 14, fontWeight: 600, color: "#051F20" }}>{it.p}</div>
                            <div style={{ fontSize: 12, color: "#235347", marginTop: 2 }}>{it.c} · {it.u} · {it.f}</div>
                          </div>
                          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                            {isAdmin && (
                              <>
                                <button title="Modificar" onClick={() => startEditProduct(it, idx)} style={{ background: "#DAF1DE", border: "none", color: "#0B2B26", cursor: "pointer", padding: 6, borderRadius: 6 }}>
                                  <Pencil size={15} />
                                </button>
                                <button title="Eliminar" onClick={() => deleteProduct(it, idx)} style={{ background: "#FEE2E2", border: "none", color: "#EF4444", cursor: "pointer", padding: 6, borderRadius: 6 }}>
                                  <Trash2 size={15} />
                                </button>
                              </>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* ========================================================================= */}
            {/* PANTALLA FORMULARIO LOGISTICA ELEGANTE */}
            {/* ========================================================================= */}
            {screen === "logForm" && areaInfo && (
              <div style={{ width: "100%", maxWidth: 1200 }}>
                <button
                  onClick={() => safeSetScreen("logistica")}
                  style={{
                    background: "#FFFFFF", border: "1.5px solid #8EB69B",
                    borderRadius: 10, padding: "7px 12px", color: "#163832", display: "inline-flex",
                    alignItems: "center", gap: 6, cursor: "pointer", marginBottom: 18, fontSize: 12.5, fontWeight: 600
                  }}
                >
                  <ArrowLeft size={15} /> Cambiar de Área
                </button>

                <div className="glass-card" style={{ padding: "26px", marginBottom: "22px", borderRadius: "22px" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 18, flexWrap: "wrap" }}>
                    <div style={{ width: 42, height: 42, background: areaInfo.accentSoft, borderRadius: 12, display: "flex", alignItems: "center", justifyContent: "center", border: "1px solid #8EB69B" }}>
                      <areaInfo.icon size={22} color={areaInfo.accent} />
                    </div>
                    <h1 className="heading-fine" style={{ fontSize: 24, margin: 0, flex: 1 }}>
                      REQUERIMIENTO DE {areaInfo.label.toUpperCase()}
                    </h1>
                    {authedUser && (
                      <button onClick={() => safeSetScreen("logCatalogo")} style={{ display: "flex", alignItems: "center", gap: 6, background: "#FFFFFF", border: "1.5px solid #8EB69B", color: areaInfo.accent, borderRadius: 10, padding: "9px 14px", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
                        <Plus size={15} /> {isTransformation ? "Administrar Productos A / B" : "Agregar Productos"}
                      </button>
                    )}
                  </div>

                  <div className="form-fields">
                    <label style={{ fontSize: 12.5, color: "#235347", fontWeight: 600, display: "flex", flexDirection: "column", gap: 6 }}>
                      Fecha
                      <input type="date" value={fecha} onChange={(e) => setFecha(e.target.value)} className="admin-input" />
                    </label>
                    <label style={{ fontSize: 12.5, color: "#235347", fontWeight: 600, display: "flex", flexDirection: "column", gap: 6 }}>
                      Encargado (Fijo por Usuario)
                      <input
                        value={encargado || sanitizeText(authedUser?.name || "").toUpperCase()}
                        readOnly
                        title="El nombre del encargado queda fijo asignado a tu usuario y no se puede modificar"
                        className="admin-input"
                        style={{ background: "#DAF1DE", color: "#0B2B26", fontWeight: 700, cursor: "not-allowed", border: "1.5px solid #8EB69B" }}
                      />
                    </label>
                  </div>
                </div>

                {/* Historial de Guardado */}
                <div className="glass-card" style={{ padding: "20px 22px", marginBottom: 22, borderRadius: "18px", overflow: "visible" }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, marginBottom: 14, flexWrap: "wrap" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                      <h3 className="heading-fine" style={{ margin: 0, fontSize: 15 }}>Historial de Guardado</h3>
                      <span style={{ fontSize: 11.5, color: "#0B2B26", background: "#DAF1DE", borderRadius: 16, padding: "3px 10px", fontWeight: 600, border: "1px solid #8EB69B" }}>
                        {historySaves.length} {historySaves.length === 1 ? "versión guardada" : "versiones guardadas"}
                      </span>
                    </div>

                    <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                      {/* Estado de conexión en la Nube Supabase */}
                      <div
                        title={cloudSyncStatus === "connected" ? "Sincronizado en tiempo real con la base de datos Supabase" : "Sin conexión a Supabase (Modo local)"}
                        style={{
                          display: "inline-flex",
                          alignItems: "center",
                          gap: 6,
                          fontSize: 11,
                          fontWeight: 600,
                          padding: "4px 10px",
                          borderRadius: 12,
                          background: cloudSyncStatus === "connected" ? "#E8F5E9" : "#FFF3E0",
                          color: cloudSyncStatus === "connected" ? "#1B5E20" : "#E65100",
                          border: `1px solid ${cloudSyncStatus === "connected" ? "#A5D6A7" : "#FFE082"}`
                        }}
                      >
                        <Cloud size={13} color={cloudSyncStatus === "connected" ? "#2E7D32" : "#F57C00"} />
                        <span>{cloudSyncStatus === "connected" ? "Supabase en Vivo" : "Modo Local"}</span>
                        {lastSyncTime && (
                          <span style={{ opacity: 0.75, fontWeight: 500 }}>({lastSyncTime})</span>
                        )}
                      </div>

                      {/* Botón interactivo para refrescar/sincronizar de inmediato */}
                      <button
                        type="button"
                        onClick={() => refreshHistoryFromStorage(true)}
                        disabled={isSyncingCloud}
                        title="Actualizar y traer los últimos guardados de todos los usuarios desde Supabase"
                        style={{
                          border: "1px solid #8EB69B",
                          background: "#DAF1DE",
                          color: "#0B2B26",
                          borderRadius: 10,
                          padding: "5px 11px",
                          fontSize: 11.5,
                          fontWeight: 600,
                          cursor: isSyncingCloud ? "wait" : "pointer",
                          display: "inline-flex",
                          alignItems: "center",
                          gap: 5,
                          boxShadow: "0 1px 3px rgba(0,0,0,0.05)"
                        }}
                      >
                        <RefreshCw size={12} className={isSyncingCloud ? "spinning" : ""} />
                        <span>{isSyncingCloud ? "Sincronizando..." : "Sincronizar"}</span>
                      </button>
                    </div>
                  </div>

                  <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginBottom: 12 }}>
                    <input
                      value={saveTitle}
                      onChange={(e) => setSaveTitle(e.target.value)}
                      placeholder="Nombre del guardado (opcional)"
                      className="admin-input"
                      style={{ flex: 1, minWidth: 200, padding: "9px 12px", fontSize: 12.5 }}
                    />
                  </div>

                  <div style={{ display: "flex", flexWrap: "wrap", gap: 10 }}>
                    {historySaves.length === 0 ? (
                      <span style={{ color: "#235347", fontSize: 12.5 }}>Todavía no hay guardados para esta área.</span>
                    ) : (
                      historySaves.map((snapshot, idx) => {
                        const cardId = `${snapshot.fecha}-${snapshot.savedAt || idx}`;
                        const isMenuOpen = openHistoryExportMenu === cardId;
                        const formattedTime = snapshot.savedAtFormatted || (snapshot.savedAt ? `${snapshot.fecha} · ${new Date(snapshot.savedAt).toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" })}` : snapshot.fecha);
                        const creatorName = (snapshot.createdBy || snapshot.encargado || "Usuario").toUpperCase();
                        const isEdited = snapshot.isEdited || !!snapshot.editedBy;
                        const editorName = (snapshot.editedBy || (isEdited ? authedUser?.name : null) || "").toUpperCase();

                        return (
                          <div
                            key={cardId}
                            style={{
                              border: "1.5px solid #8EB69B", borderRadius: 14, background: "#FFFFFF",
                              color: "#051F20", padding: "12px 14px", fontSize: 12, fontWeight: 600,
                              display: "flex", flexDirection: "column", gap: 6, minWidth: 240, textAlign: "left",
                              position: "relative", boxShadow: "0 2px 8px rgba(5, 31, 32, 0.04)"
                            }}
                          >
                            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
                              <span style={{ color: "#051F20", fontWeight: 700, fontSize: 13 }}>
                                {snapshot.title || `Guardado ${idx + 1}`}
                              </span>
                              {isAdmin && (
                                <button
                                  onClick={() => deleteHistorySnapshot(snapshot)}
                                  title="Eliminar (Solo Administradores)"
                                  style={{
                                    border: "none", background: "#FEE2E2", color: "#EF4444",
                                    borderRadius: 6, padding: "4px 6px", cursor: "pointer",
                                    display: "inline-flex", alignItems: "center", justifyContent: "center"
                                  }}
                                >
                                  <Trash2 size={13} />
                                </button>
                              )}
                            </div>

                            {/* Hora y Fecha de Guardado */}
                            <div style={{ color: "#235347", fontWeight: 500, fontSize: 11.5, display: "flex", alignItems: "center", gap: 5 }}>
                              <Calendar size={13} color="#8EB69B" />
                              <span>{formattedTime}</span>
                            </div>

                            {/* Encargado Creador */}
                            <div style={{ color: "#0B2B26", fontWeight: 600, fontSize: 11.5, display: "flex", alignItems: "center", gap: 5 }}>
                              <User size={13} color="#0B2B26" />
                              <span>Generado por: <strong>{creatorName}</strong></span>
                            </div>

                            {/* Badge cuando fue editado */}
                            {isEdited && editorName && (
                              <div style={{
                                background: "#DAF1DE", color: "#0B2B26", padding: "3.5px 8px",
                                borderRadius: 8, fontSize: 10.5, fontWeight: 700, display: "flex",
                                alignItems: "center", gap: 5, border: "1px solid #8EB69B", marginTop: 1
                              }}>
                                <Pencil size={11} color="#0B2B26" />
                                <span>EDITADO POR: {editorName}</span>
                              </div>
                            )}

                            {/* Acciones dentro del documento guardado: Editar y Exportar */}
                            <div style={{ display: "flex", gap: 6, marginTop: 4, position: "relative" }}>
                              <button
                                onClick={() => restoreHistorySnapshot(snapshot)}
                                title="Cargar y editar este registro"
                                style={{
                                  flex: 1, border: "none", background: "#DAF1DE", color: "#0B2B26",
                                  borderRadius: 8, padding: "6px 10px", cursor: "pointer",
                                  fontSize: 11.5, fontWeight: 600, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 4
                                }}
                              >
                                <Pencil size={13} /> Editar
                              </button>

                              <div className="history-export-container" style={{ position: "relative", flex: 1 }}>
                                <button
                                  onClick={(e) => { e.stopPropagation(); setOpenHistoryExportMenu(isMenuOpen ? null : cardId); }}
                                  style={{
                                    width: "100%", background: "#0B2B26", color: "#FFFFFF", border: "none",
                                    borderRadius: 8, padding: "6px 10px", fontSize: 11.5, fontWeight: 600,
                                    cursor: "pointer", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 4
                                  }}
                                >
                                  <FileDown size={13} /> Exportar <ChevronDown size={12} style={{ transform: isMenuOpen ? "rotate(180deg)" : "none", transition: "transform 0.2s" }} />
                                </button>

                                {isMenuOpen && (
                                  <div
                                    style={{
                                      position: "absolute", bottom: "100%", right: 0, marginBottom: 6, zIndex: 9999,
                                      background: "#FFFFFF", borderRadius: 12, border: "1.5px solid #8EB69B",
                                      boxShadow: "0 12px 35px rgba(5,31,32,0.3)", width: 220, overflow: "hidden",
                                      animation: "fadeIn 0.15s ease-out"
                                    }}
                                  >
                                    <button
                                      onClick={(e) => { e.stopPropagation(); exportSnapshotXlsx(snapshot); setOpenHistoryExportMenu(null); }}
                                      style={{
                                        width: "100%", padding: "11px 14px", background: "transparent", border: "none",
                                        display: "flex", alignItems: "center", gap: 8, cursor: "pointer",
                                        fontSize: 12, fontWeight: 600, color: "#0B2B26", textAlign: "left",
                                        borderBottom: "1px solid #E5E7EB", transition: "background 0.15s"
                                      }}
                                      onMouseOver={(e) => e.currentTarget.style.background = "#DAF1DE"}
                                      onMouseOut={(e) => e.currentTarget.style.background = "transparent"}
                                    >
                                      <FileSpreadsheet size={16} color="#163832" /> Exportar a Excel (.xlsx)
                                    </button>
                                    <button
                                      onClick={(e) => { e.stopPropagation(); exportSnapshotPdf(snapshot); setOpenHistoryExportMenu(null); }}
                                      style={{
                                        width: "100%", padding: "11px 14px", background: "transparent", border: "none",
                                        display: "flex", alignItems: "center", gap: 8, cursor: "pointer",
                                        fontSize: 12, fontWeight: 600, color: "#0B2B26", textAlign: "left",
                                        transition: "background 0.15s"
                                      }}
                                      onMouseOver={(e) => e.currentTarget.style.background = "#DAF1DE"}
                                      onMouseOut={(e) => e.currentTarget.style.background = "transparent"}
                                    >
                                      <FileText size={16} color="#C53030" /> Exportar a PDF (.pdf)
                                    </button>
                                  </div>
                                )}
                              </div>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>

                {/* Toolbar Elegante */}
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 20, flexWrap: "wrap" }}>
                  {!isTransformation && (
                    <>
                      <div style={{ position: "relative", flex: 1, minWidth: 220, maxWidth: 360 }}>
                        <Search size={16} style={{ position: "absolute", left: 12, top: 12, color: "#8EB69B" }} />
                        <input
                          value={query}
                          onChange={(e) => setQuery(e.target.value)}
                          placeholder="Buscar insumo..."
                          className="admin-input"
                          style={{ paddingLeft: 38, paddingRight: query ? 32 : 12, padding: "9px 12px 9px 38px" }}
                        />
                        {query && (
                          <button
                            onClick={() => setQuery("")}
                            style={{ position: "absolute", right: 8, top: 10, background: "transparent", border: "none", color: "#8EB69B", cursor: "pointer", padding: 2 }}
                          >
                            <X size={15} />
                          </button>
                        )}
                      </div>

                      {uniqueCategories.length > 1 && (
                        <select
                          value={categoryFilter}
                          onChange={(e) => setCategoryFilter(e.target.value)}
                          className="admin-input"
                          style={{ minWidth: 180, maxWidth: 260, padding: "9px 12px" }}
                        >
                          <option value="all">Todas las categorías</option>
                          {uniqueCategories.map((cat) => (
                            <option key={cat} value={cat}>{cat}</option>
                          ))}
                        </select>
                      )}

                      {availableHeaderFilters.length > 0 && (
                        <select
                          value={headerFilter}
                          onChange={(e) => setHeaderFilter(e.target.value)}
                          className="admin-input"
                          style={{ minWidth: 150, maxWidth: 190, padding: "9px 12px" }}
                        >
                          <option value="all">Mostrar todos</option>
                          {availableHeaderFilters.map((filter) => <option key={filter.key} value={filter.key}>{`Con ${filter.label}`}</option>)}
                        </select>
                      )}
                    </>
                  )}



                  <div style={{ marginLeft: isTransformation ? "0" : "auto", display: "flex", alignItems: "center", gap: 8 }}>
                    {loadStatus === 'found' && <span style={{ color: '#0B2B26', fontSize: 12, fontWeight: 700, background: '#DAF1DE', padding: '6px 12px', borderRadius: '16px', display: 'flex', alignItems: 'center', gap: 5, border: "1px solid #8EB69B" }}><CheckCircle2 size={14} /> Cargado</span>}
                    {loadStatus === 'saved' && <span style={{ color: '#0B2B26', fontSize: 12, fontWeight: 700, background: '#DAF1DE', padding: '6px 12px', borderRadius: '16px', display: 'flex', alignItems: 'center', gap: 5, border: "1px solid #8EB69B" }}><Save size={14} /> Guardado</span>}
                  </div>
                </div>

                {/* Tabla de Productos Elegante */}
                {catalog.length > 0 ? (
                  <div style={{ display: "flex", flexDirection: "column", gap: 16, marginBottom: 28 }}>
                    {groupedCatalog.map((group) => {
                      const isOpen = isTransformation || !!openCats[group.categoria] || query.trim() !== "" || headerFilter !== "all" || categoryFilter !== "all";
                      const hasBase2 = !isTransformation && group.items.some((it) => it.b2 || it.l2);
                      return (
                        <div key={group.categoria} className="glass-card" style={{ overflow: "hidden", padding: 0, borderRadius: "18px" }}>
                          {!isTransformation && (
                            <button
                              onClick={() => toggleCat(group.categoria)}
                              style={{
                                width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between",
                                background: isOpen ? areaInfo.accentSoft : "#FFFFFF", border: "none",
                                color: isOpen ? areaInfo.accent : "#051F20", padding: "16px 20px",
                                fontSize: 14, fontWeight: 700, cursor: "pointer", textAlign: "left", transition: "background 0.2s",
                                gap: 8, boxSizing: "border-box"
                              }}
                            >
                              <span className="heading-fine" style={{ flex: "1 1 auto", minWidth: 0, overflowWrap: "break-word", wordBreak: "break-word", lineHeight: 1.3 }}>
                                {group.categoria} <span style={{ color: "#235347", fontSize: 12, fontWeight: 500, marginLeft: 6, display: "inline-block" }}>({group.items.length} ítems)</span>
                              </span>
                              <ChevronDown size={18} style={{ transform: isOpen ? "rotate(180deg)" : "none", transition: "transform .2s", flexShrink: 0, marginLeft: 6 }} />
                            </button>
                          )}
                          {isOpen && (
                            <div className="table-scroll" style={{ border: "none", borderRadius: 0, boxShadow: "none" }}>
                              <table className="cat-table">
                                <thead>
                                  <tr>
                                    <th>{isTransformation ? "PRODUCTO A" : (group.items[0]?.l1 || "BASE 1")}</th>
                                    {hasBase2 && <th>{group.items[0]?.l2 || "BASE 2"}</th>}
                                    {isTransformation && <th>MEDIDA A</th>}
                                    {isTransformation && <th>CANTIDAD A</th>}
                                    {!isTransformation && <th>{areaInfo.unidLabel}</th>}
                                    {areaInfo.hasFrecuencia && <th>FRECUENCIA</th>}
                                    {!isTransformation && <th>{areaInfo.productLabel}</th>}
                                    {areaInfo.captureCols.map((c) => <th key={c.key} style={{ color: "#0B2B26" }}>{c.label}</th>)}
                                    {isTransformation && <th>CANTIDAD B</th>}
                                    <th>OBSERVACIONES</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  {group.items.map((it) => {
                                    const key = catalogRowKey(it);
                                    const e = entries[key] || emptyEntry(area);
                                    const productoA = e.productoA || it.p;
                                    const medidaA = e.medidaA || it.u;
                                    return (
                                      <tr key={key}>
                                        <td>
                                          {isTransformation ? (
                                            <select value={productoA} onChange={(ev) => updateTransformationProduct(key, "productoA", ev.target.value)} style={{ width: 200 }}>
                                              <option value="">Seleccionar Producto A...</option>
                                              {optionsA.map((option) => (
                                                <option key={option.id || option.name} value={option.name}>
                                                  {option.name} ({option.unit})
                                                </option>
                                              ))}
                                            </select>
                                          ) : <span style={{ color: "#235347", fontWeight: 600 }}>{it.b1}</span>}
                                        </td>
                                        {hasBase2 && <td><span style={{ color: "#235347", fontWeight: 600 }}>{it.b2}</span></td>}
                                        {isTransformation && <td><span style={{ color: "#235347", fontWeight: 600 }}>{medidaA}</span></td>}
                                        {isTransformation && <td><input type="text" inputMode="decimal" pattern="[0-9.]*" value={e.cantidadA || ""} onChange={(ev) => updateEntry(key, "cantidadA", ev.target.value)} placeholder="0" /></td>}
                                        {!isTransformation && <td><span style={{ background: "#DAF1DE", padding: "3px 6px", borderRadius: 4, fontSize: 10.5, fontWeight: 700, color: "#0B2B26" }}>{it.u}</span></td>}
                                        {areaInfo.hasFrecuencia && <td><span style={{ color: "#235347", fontSize: 11.5 }}>{it.f}</span></td>}
                                        {!isTransformation && <td className="prod-cell">{it.p}</td>}
                                        {areaInfo.captureCols.map((c) => (
                                          <td key={c.key} style={{ textAlign: c.type === "checkbox" ? "center" : "left" }}>
                                            {c.type === "productSelect" ? (
                                              <select value={e[c.key] || ""} onChange={(ev) => updateTransformationProduct(key, c.key, ev.target.value)} style={{ width: 200 }}>
                                                <option value="">Seleccionar Producto B...</option>
                                                {optionsB.map((option) => (
                                                  <option key={option.id || option.name} value={option.name}>
                                                    {option.name} ({option.unit})
                                                  </option>
                                                ))}
                                              </select>
                                            ) : c.key === "medidaB" && isTransformation ? (
                                              <input type="text" value={e[c.key] || ""} readOnly placeholder="-" style={{ background: "#DAF1DE" }} />
                                            ) : c.type === "checkbox" ? (
                                              <input type="checkbox" checked={!!e[c.key]} onChange={(ev) => updateEntry(key, c.key, ev.target.checked)} style={{ width: 18, height: 18, accentColor: "#0B2B26", cursor: "pointer" }} />
                                            ) : (
                                              <input type="text" inputMode="decimal" pattern="[0-9.]*" value={e[c.key]} onChange={(ev) => updateEntry(key, c.key, ev.target.value)} placeholder="0" />
                                            )}
                                          </td>
                                        ))}
                                        {isTransformation && <td><input type="text" value={e.cantidadB || ""} onChange={(ev) => updateEntry(key, "cantidadB", ev.target.value)} placeholder="0" /></td>}
                                        <td><input type="text" className="wide" value={e.observaciones} onChange={(ev) => updateEntry(key, "observaciones", ev.target.value)} placeholder="Notas..." /></td>
                                      </tr>
                                    );
                                  })}
                                </tbody>
                              </table>
                            </div>
                          )}
                        </div>
                      );
                    })}
                    {isTransformation && (
                      <button onClick={addTransformationRow} style={{ alignSelf: "flex-start", display: "flex", alignItems: "center", gap: 6, background: "#FFFFFF", border: "1.5px dashed #8EB69B", color: "#163832", borderRadius: 10, padding: "10px 16px", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
                        <Plus size={16} /> Nueva Fila
                      </button>
                    )}
                  </div>
                ) : (
                  <div className="glass-card" style={{ padding: "40px 20px", textAlign: "center", borderRadius: "20px" }}>
                    <p style={{ color: "#235347", fontSize: 14, fontWeight: 500 }}>
                      Esta área no tiene insumos configurados.
                    </p>
                  </div>
                )}

                {catalog.length > 0 && (
                  <div style={{ display: 'flex', gap: '14px', marginTop: '20px', flexWrap: 'wrap' }}>
                    <button
                      onClick={() => handleSaveData(false, false)}
                      style={{
                        flex: 1, minWidth: '200px', background: "#FFFFFF", color: "#0B2B26",
                        border: "1.5px solid #0B2B26", borderRadius: 14, padding: "15px",
                        fontWeight: 600, fontSize: 14, cursor: "pointer", display: "flex",
                        alignItems: "center", justifyContent: "center", gap: 8, transition: "all 0.2s"
                      }}
                      onMouseOver={(e) => e.currentTarget.style.background = "#DAF1DE"}
                      onMouseOut={(e) => e.currentTarget.style.background = "#FFFFFF"}
                    >
                      <Save size={18} /> Guardar Progreso
                    </button>

                    <button
                      onClick={() => handleSaveAndSendRequirement()}
                      style={{
                        flex: 2, minWidth: '280px', background: "#0B2B26",
                        color: "#FFFFFF", border: "none", borderRadius: 14, padding: "15px",
                        fontWeight: 700, fontSize: 14.5, cursor: "pointer", display: "flex",
                        alignItems: "center", justifyContent: "center", gap: 8,
                        boxShadow: "0 4px 16px rgba(11, 43, 38, 0.25)", transition: "all 0.2s"
                      }}
                      onMouseOver={(e) => e.currentTarget.style.background = "#163832"}
                      onMouseOut={(e) => e.currentTarget.style.background = "#0B2B26"}
                    >
                      <Send size={18} /> GUARDAR Y ENVIAR REQUERIMIENTO
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* ========================================================================= */}
            {/* PANTALLA SELECCIÓN DE ÁREA CHECKLIST ELEGANTE */}
            {/* ========================================================================= */}
            {screen === "operaciones" && (
              <div style={{ width: "100%", maxWidth: 900, marginTop: 10 }}>
                <button
                  onClick={() => safeSetScreen("hub")}
                  style={{
                    background: "#FFFFFF", border: "1.5px solid #8EB69B",
                    borderRadius: 10, padding: "7px 12px", color: "#163832", display: "inline-flex",
                    alignItems: "center", gap: 6, cursor: "pointer", marginBottom: 18, fontSize: 12.5, fontWeight: 600
                  }}
                >
                  <ArrowLeft size={15} /> Volver al Inicio
                </button>
                <h1 className="heading-fine" style={{ fontSize: 26, margin: "0 0 20px" }}>
                  Operaciones Diarias · Check list
                </h1>
                <div className="area-grid">
                  {Object.entries(CHECKLIST_AREAS).map(([key, info]) => {
                    const Icon = info.icon;
                    const disponible = !!CHECKLIST_ASPECTOS[key];
                    return (
                      <button
                        key={key}
                        onClick={() => disponible && pickCheckArea(key)}
                        disabled={!disponible}
                        className={`dept-card ${!disponible ? 'dept-card-disabled' : ''}`}
                        style={{ display: "flex", alignItems: "center", gap: 16, padding: "20px 22px" }}
                      >
                        <div style={{ width: 48, height: 48, borderRadius: 14, background: info.accentSoft, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, border: "1px solid #8EB69B" }}>
                          <Icon size={24} color={info.accent} />
                        </div>
                        <div>
                          <div className="heading-fine" style={{ fontSize: 19 }}>{info.label}</div>
                          <div style={{ fontSize: 12.5, color: "#235347", marginTop: 2, fontWeight: 500 }}>
                            {disponible ? (key === 'SALON' ? '2 Módulos: Imagen Personal · Limpieza y Orden' : 'Registro de higiene de personal') : 'Plantilla en desarrollo'}
                          </div>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ========================================================================= */}
            {/* PANTALLA FORMULARIO CHECKLIST ELEGANTE (SALÓN: IMAGEN PERSONAL / LIMPIEZA Y ORDEN) */}
            {/* ========================================================================= */}
            {screen === "checklist" && checkAreaInfo && checkAspectos && (

                  </div>

                  {changePassError && (
                    <div style={{ background: "#FEE2E2", border: "1px solid #FCA5A5", color: "#B91C1C", borderRadius: 10, padding: "10px 14px", fontSize: 12.5, fontWeight: 500, marginBottom: 16, display: "flex", alignItems: "center", gap: 8 }}>
                      <ShieldAlert size={16} /> {changePassError}
                    </div>
                  )}

                  {changePassSuccess && (
                    <div style={{ background: "#DAF1DE", border: "1px solid #8EB69B", color: "#0B2B26", borderRadius: 10, padding: "10px 14px", fontSize: 12.5, fontWeight: 600, marginBottom: 16, display: "flex", alignItems: "center", gap: 8 }}>
                      <CheckCircle2 size={16} /> {changePassSuccess}
                    </div>
                  )}

                  <form onSubmit={handleChangePasswordSubmit} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                    <label style={{ fontSize: 12.5, color: "#235347", fontWeight: 600, display: "flex", flexDirection: "column", gap: 5 }}>
                      Contraseña Actual
                      <input
                        type="password"
                        required
                        value={changePassForm.currentPass}
                        onChange={(e) => setChangePassForm({ ...changePassForm, currentPass: e.target.value })}
                        placeholder="••••••••"
                        className="admin-input"
                      />
                    </label>

                    <label style={{ fontSize: 12.5, color: "#235347", fontWeight: 600, display: "flex", flexDirection: "column", gap: 5 }}>
                      Nueva Contraseña
                      <input
                        type="password"
                        required
                        value={changePassForm.newPass}
                        onChange={(e) => setChangePassForm({ ...changePassForm, newPass: e.target.value })}
                        placeholder="Mínimo 4 caracteres"
                        className="admin-input"
                      />
                    </label>

                    <label style={{ fontSize: 12.5, color: "#235347", fontWeight: 600, display: "flex", flexDirection: "column", gap: 5 }}>
                      Confirmar Nueva Contraseña
                      <input
                        type="password"
                        required
                        value={changePassForm.confirmPass}
                        onChange={(e) => setChangePassForm({ ...changePassForm, confirmPass: e.target.value })}
                        placeholder="Repite la nueva contraseña"
                        className="admin-input"
                      />
                    </label>

                    <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
                      <button
                        type="submit"
                        style={{
                          flex: 1, background: "#0B2B26", color: "#FFFFFF", border: "none",
                          borderRadius: 10, padding: "11px", fontWeight: 600, fontSize: 13,
                          cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6
                        }}
                      >
                        <Save size={15} /> Actualizar
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          setIsChangePassOpen(false);
                          setChangePassError("");
                          setChangePassSuccess("");
                          setChangePassForm({ currentPass: "", newPass: "", confirmPass: "" });
                        }}
                        style={{
                          background: "#FFFFFF", border: "1.5px solid #8EB69B", color: "#235347",
                          borderRadius: 10, padding: "11px 16px", fontWeight: 600, fontSize: 13, cursor: "pointer"
                        }}
                      >
                        Cancelar
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Modal AVISO DE SOBREESCRITURA DE HISTORIAL */}
            {overwriteModalInfo && (
              <div role="dialog" aria-modal="true" aria-labelledby="overwrite-modal-title" style={{ position: "fixed", inset: 0, zIndex: 1100, display: "flex", alignItems: "center", justifyContent: "center", padding: 20, background: "rgba(5, 31, 32, 0.55)", backdropFilter: "blur(8px)", animation: "fadeIn 0.2s ease-out" }}>
                <div className="glass-card" style={{ width: "100%", maxWidth: 440, padding: "30px 26px", background: "#FFFFFF", boxShadow: "0 20px 50px rgba(5,31,32,0.3)", animation: "scaleIn 0.2s ease-out", border: "2px solid #F59E0B", borderRadius: 24, textAlign: "center" }}>
                  <div style={{ width: 64, height: 64, borderRadius: "50%", background: "#FEF3C7", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 18px", border: "2px solid #F59E0B" }}>
                    <AlertTriangle size={36} color="#D97706" />
                  </div>

                  <h2 id="overwrite-modal-title" className="heading-fine" style={{ margin: "0 0 10px", fontSize: 20, color: "#92400E" }}>
                    ¡Aviso de Sobrescritura en Historial!
                  </h2>

                  <p style={{ color: "#235347", fontSize: 13.5, lineHeight: 1.55, marginBottom: 22 }}>
                    Ya existe un registro guardado en el historial para el área <strong style={{ color: "#051F20" }}>{areaInfo?.label || "esta área"}</strong> con la fecha <strong style={{ color: "#051F20" }}>{overwriteModalInfo.cleanFecha}</strong>.
                    <br /><br />
                    <span style={{ fontSize: 12.5, color: "#6B7280" }}>
                      (Guardado previamente por: <strong>{overwriteModalInfo.existing?.savedBy || "Usuario"}</strong>)
                    </span>
                  </p>

                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    <button
                      onClick={() => handleSaveAndSendRequirement(true, false)}
                      style={{
                        width: "100%", background: "#D97706", color: "#FFFFFF", border: "none",
                        borderRadius: 12, padding: "13px", fontWeight: 700, fontSize: 13.5,
                        cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
                        boxShadow: "0 4px 12px rgba(217, 119, 6, 0.3)", transition: "all 0.2s"
                      }}
                      onMouseOver={(e) => e.currentTarget.style.background = "#B45309"}
                      onMouseOut={(e) => e.currentTarget.style.background = "#D97706"}
                    >
                      <Save size={16} /> Sobrescribir Registro Existente
                    </button>

                    <button
                      onClick={() => handleSaveAndSendRequirement(false, true)}
                      style={{
                        width: "100%", background: "#FFFFFF", color: "#0B2B26", border: "1.5px solid #0B2B26",
                        borderRadius: 12, padding: "12px", fontWeight: 600, fontSize: 13,
                        cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
                        transition: "all 0.2s"
                      }}
                      onMouseOver={(e) => e.currentTarget.style.background = "#DAF1DE"}
                      onMouseOut={(e) => e.currentTarget.style.background = "#FFFFFF"}
                    >
                      <Plus size={16} /> Guardar como Nuevo Registro
                    </button>

                    <button
                      onClick={() => setOverwriteModalInfo(null)}
                      style={{
                        width: "100%", background: "transparent", color: "#6B7280", border: "none",
                        borderRadius: 12, padding: "10px", fontWeight: 500, fontSize: 12.5,
                        cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6
                      }}
                      onMouseOver={(e) => e.currentTarget.style.color = "#111827"}
                      onMouseOut={(e) => e.currentTarget.style.color = "#6B7280"}
                    >
                      <X size={15} /> Cancelar Acción
                    </button>
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
