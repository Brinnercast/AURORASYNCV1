    const MAX_LOGIN_ATTEMPTS = 5;
    const LOCKOUT_DURATION_MS = 15 * 60 * 1000; // 15 minutos de bloqueo temporal

    // Generar Salt criptográficamente seguro de 16 bytes
    function generateCryptoSalt() {
      const bytes = new Uint8Array(16);
      window.crypto.getRandomValues(bytes);
      return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Hashear contraseña con SHA-256 + Salt
    async function hashPasswordWithSalt(password, existingSalt = null) {
      const salt = existingSalt || generateCryptoSalt();
      const enc = new TextEncoder();
      const data = enc.encode(salt + ":" + String(password));
      const hashBuffer = await window.crypto.subtle.digest("SHA-256", data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      return `$sha256$${salt}$${hashHex}`;
    }

    // Verificar contraseña contra hash almacenado (con soporte de migración legacy)
    async function verifyPassword(inputPassword, storedHashOrPlain) {
      if (!storedHashOrPlain || typeof inputPassword !== "string") return false;
      if (!storedHashOrPlain.startsWith("$sha256$")) {
        return inputPassword === storedHashOrPlain;
      }
      const parts = storedHashOrPlain.split("$");
      if (parts.length < 4) return false;
      const salt = parts[2];
      const expectedHashHex = parts[3];
      const enc = new TextEncoder();
      const data = enc.encode(salt + ":" + inputPassword);
      const hashBuffer = await window.crypto.subtle.digest("SHA-256", data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      return hashHex === expectedHashHex;
    }

    // Sanitización estricta de cadenas de texto (prevención XSS y control chars)
    function sanitizeText(str, maxLength = 250) {
      if (str === null || str === undefined) return "";
      let s = String(str);
      // Elimina tags script y style con su contenido interno
      s = s.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
      s = s.replace(/<style\b[^<]*(?:(?!<\/style>)<[^<]*)*<\/style>/gi, '');
      // Elimina cualquier tag HTML remanente
      s = s.replace(/<[^>]*>?/gm, '');
      // Elimina protocolos de inyección y handlers
      s = s.replace(/javascript\s*:/gi, '');
      s = s.replace(/vbscript\s*:/gi, '');

    // Sanitización y validación estricta de números

      const num = parseFloat(cleaned);
      if (isNaN(num)) return defaultVal;
      const clamped = Math.min(Math.max(num, min), max);

    // Utils de Almacenamiento Centralizado en Supabase con Respaldo en LocalStorage
    async function storageGet(key, fallback) {
      if (LOCAL_ONLY_KEYS.has(key)) {
        try {
          const val = localStorage.getItem(key);
          return val !== null ? JSON.parse(val) : fallback;
        } catch (e) { return fallback; }
      }

      // 1. Intentar consultar en Supabase
      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from("aurora_store")
            .select("value")
            .eq("key", key)
            .maybeSingle();

          if (!error && data && data.value !== undefined && data.value !== null) {
            try { localStorage.setItem(key, JSON.stringify(data.value)); } catch (e) { }
            return data.value;
          }
        } catch (err) {
          console.warn("Error leyendo de Supabase para key:", key, err);
        }
      }

      // 2. Fallback a LocalStorage si la nube aún no tiene el dato o si no hay conexión
      try {
        const val = localStorage.getItem(key);
        if (val !== null) {
          const parsed = JSON.parse(val);
          return parsed;
        }
      } catch (e) { }

      // 3. Fallback al valor por defecto (sin sobreescribir la base de datos)
      return fallback;
    }

    async function storageSet(key, value) {
      // Siempre guardar de inmediato en LocalStorage (acceso instantáneo y respaldo offline)
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) { }

      if (LOCAL_ONLY_KEYS.has(key)) {
        return true;
      }

      // Guardar en la nube compartida de Supabase
      if (supabaseClient) {
        try {
          const { error } = await supabaseClient
            .from("aurora_store")
            .upsert({ key, value, updated_at: new Date().toISOString() });
          if (error) {
            console.error("Supabase upsert error:", error);
            return false;
          }
          return true;
        } catch (err) {
          console.error("Error guardando en Supabase:", err);
          return false;
        }
      }
      return true;
    }

    // Consulta agregada y multiusuario del historial de un área en Supabase
    async function fetchAreaHistory(area) {
      if (!area) return [];
      const historyMap = new Map();

      // 1. Cargar desde caché local para despliegue instantáneo
      try {
        const localRaw = localStorage.getItem(`reqHistory:${area}`);
        if (localRaw) {
          const localList = JSON.parse(localRaw);
          if (Array.isArray(localList)) {
            localList.forEach(item => {
              if (item) {
                const uid = item.id || `${item.fecha}_${item.savedAt}` || item.title;
                if (uid) historyMap.set(uid, item);
              }
            });
          }
        }
      } catch (e) { }

      // 2. Consultar en Supabase todos los registros individuales del área (req:${area}:*)
      if (supabaseClient) {
        try {
          const { data: records, error } = await supabaseClient
            .from("aurora_store")
            .select("key, value, updated_at")
            .like("key", `req:${area}:%`)
            .order("updated_at", { ascending: false });

          if (!error && Array.isArray(records)) {
            records.forEach(r => {
              const item = r.value;
              if (item && typeof item === "object") {
                const uid = item.id || `${item.fecha}_${item.savedAt}` || r.key;
                if (uid) {
                  historyMap.set(uid, {
                    ...item,
                    id: uid
                  });
                }
              }
            });
          }

          // Consultar también la clave consolidada reqHistory:${area} (retrocompatibilidad)
          const { data: legacyRow } = await supabaseClient
            .from("aurora_store")
            .select("value")
            .eq("key", `reqHistory:${area}`)
            .maybeSingle();

          if (legacyRow && Array.isArray(legacyRow.value)) {
            legacyRow.value.forEach(item => {
              if (item && typeof item === "object") {
                const uid = item.id || `${item.fecha}_${item.savedAt}` || item.title;
                if (uid && !historyMap.has(uid)) {
                  historyMap.set(uid, item);
                }
              }
            });
          }
        } catch (err) {
          console.warn(`Error consultando historial de ${area} en Supabase:`, err);
        }
      }

      const combined = Array.from(historyMap.values()).sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));

      // Actualizar caché local con la lista completa consolidada
      try {
        localStorage.setItem(`reqHistory:${area}`, JSON.stringify(combined));
      } catch (e) { }

      return combined;
    }

    // Guardado seguro e inmutable de un requerimiento en Supabase
    async function saveRequirementSnapshot(area, snapshot) {
      if (!area || !snapshot) return [];
      const snapId = snapshot.id || `${snapshot.fecha}_${snapshot.savedAt || Date.now()}`;
      const enrichedSnapshot = {
        ...snapshot,
        id: snapId
      };

      // 1. Guardar individualmente en Supabase con clave única inmutable
      //    (impide que otros usuarios borren o sobrescriban este requerimiento)
      if (supabaseClient) {
        try {
          await supabaseClient
            .from("aurora_store")
            .upsert({
              key: `req:${area}:${snapId}`,
              value: enrichedSnapshot,
              updated_at: new Date().toISOString()
            });

          // Guardar también bajo el puntero por fecha (compatibilidad)
          await supabaseClient
            .from("aurora_store")
            .upsert({
              key: `req:${area}:${enrichedSnapshot.fecha}`,
              value: enrichedSnapshot,
              updated_at: new Date().toISOString()
            });
        } catch (err) {
          console.error("Error guardando snapshot individual en Supabase:", err);
        }
      }

      // 2. Obtener lista consolidada desde la nube y actualizar la lista visible y de respaldo
      const allHistory = await fetchAreaHistory(area);
      const withoutCurrent = allHistory.filter(it => it.id !== snapId && !(it.fecha === enrichedSnapshot.fecha && it.title === enrichedSnapshot.title && Math.abs((it.savedAt || 0) - (enrichedSnapshot.savedAt || 0)) < 1000));
      const merged = [enrichedSnapshot, ...withoutCurrent].sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0)).slice(0, 30);

      try {
        localStorage.setItem(`reqHistory:${area}`, JSON.stringify(merged));
        if (supabaseClient) {
          await supabaseClient
            .from("aurora_store")
            .upsert({ key: `reqHistory:${area}`, value: merged, updated_at: new Date().toISOString() });
        }
      } catch (e) { }

      return merged;
    }

    // Eliminación de un requerimiento (solo administradores)
    async function deleteRequirementSnapshot(area, target) {
      if (!area || !target) return [];
      const targetId = target.id || `${target.fecha}_${target.savedAt}`;

      if (supabaseClient) {
        try {
          await supabaseClient
            .from("aurora_store")
            .delete()
            .or(`key.eq.req:${area}:${targetId},key.eq.req:${area}:${target.fecha}`);
        } catch (err) {
          console.warn("Error eliminando fila individual de Supabase:", err);
        }
      }

      const currentList = await fetchAreaHistory(area);
      const filtered = currentList.filter(it => {
        if (it.id && it.id === targetId) return false;
        if (it.savedAt === target.savedAt && it.fecha === target.fecha && it.title === target.title) return false;
        return true;
      });

      try {
        localStorage.setItem(`reqHistory:${area}`, JSON.stringify(filtered));
        if (supabaseClient) {
          await supabaseClient
            .from("aurora_store")
            .upsert({ key: `reqHistory:${area}`, value: filtered, updated_at: new Date().toISOString() });
        }
      } catch (e) { }

      return filtered;
    }

    // Migración automática: sube los datos guardados previamente en este navegador a la nube sin sobreescribir datos ajenos
    async function autoMigrateLocalDataToSupabase() {
      if (!supabaseClient) return;
      try {
        const keysToMigrate = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && !LOCAL_ONLY_KEYS.has(k) && !k.startsWith("aurora_gdrive") && !k.startsWith("__")) {
            keysToMigrate.push(k);
          }
        }
        for (const k of keysToMigrate) {
          try {
            const raw = localStorage.getItem(k);
            if (!raw) continue;
            const parsed = JSON.parse(raw);
            if (parsed === undefined || parsed === null) continue;

            if (k.startsWith("reqHistory:")) {
              if (Array.isArray(parsed) && parsed.length > 0) {
                const areaKey = k.replace("reqHistory:", "");
                for (const item of parsed) {
                  if (item && item.fecha) {
                    await saveRequirementSnapshot(areaKey, item);
                  }
                }
              }
            } else if (k.startsWith("req:")) {
              const { data: remote } = await supabaseClient.from("aurora_store").select("key").eq("key", k).maybeSingle();
              if (!remote) {
                await supabaseClient.from("aurora_store").upsert({ key: k, value: parsed, updated_at: new Date().toISOString() });
              }
            } else {
              const { data: remote } = await supabaseClient.from("aurora_store").select("key").eq("key", k).maybeSingle();
              if (!remote) {
                await supabaseClient.from("aurora_store").upsert({ key: k, value: parsed, updated_at: new Date().toISOString() });
              }
            }
          } catch (e) { }
        }
      } catch (err) { }
    }

    async function checkAccountLockout(username) {
      if (!username) return { locked: false, remainingMinutes: 0 };
      const security = await getAuthSecurity();
      const userRecord = security[username];
      if (!userRecord) return { locked: false, remainingMinutes: 0 };

      const now = Date.now();
      if (userRecord.lockedUntil && now < userRecord.lockedUntil) {
        const remainingMs = userRecord.lockedUntil - now;
        const remainingMinutes = Math.ceil(remainingMs / 60000);
        return { locked: true, remainingMinutes };
      }
      return { locked: false, remainingMinutes: 0 };
    }

    async function recordFailedLoginAttempt(username) {
      if (!username) return { isNowLocked: false, remainingMinutes: 0 };
      const security = await getAuthSecurity();
      const now = Date.now();
      const userRecord = security[username] || { attempts: 0, lockedUntil: null, lastAttempt: now };

      userRecord.attempts = (userRecord.attempts || 0) + 1;
      userRecord.lastAttempt = now;

      let isNowLocked = false;
      let remainingMinutes = 0;

      if (userRecord.attempts >= MAX_LOGIN_ATTEMPTS) {
        userRecord.lockedUntil = now + LOCKOUT_DURATION_MS;
        isNowLocked = true;
        remainingMinutes = Math.ceil(LOCKOUT_DURATION_MS / 60000);
      }

      security[username] = userRecord;
      await saveAuthSecurity(security);
      return { isNowLocked, remainingMinutes };
    }

    async function clearLoginAttempts(username) {
      if (!username) return;
      const security = await getAuthSecurity();
      if (security[username]) {
        delete security[username];
        await saveAuthSecurity(security);
      }
    }

    async function unlockUserAccount(username) {

    // FORMATO EXCEL PROFESIONAL: FUENTE SEGOE UI, BORDES COMPLETOS, ENCABEZADOS Y ALINEACIONES
    function applyTableStyle(ws, boldRows, headerRowIdx, isTransform = false) {
      const xlsxLib = getXLSXLib();
      if (!xlsxLib || !ws || !ws["!ref"]) return;
      const fontName = "Segoe UI";
      const borderThin = { style: "thin", color: { rgb: "FFB0B0B0" } };
      const borderCell = { top: borderThin, bottom: borderThin, left: borderThin, right: borderThin };
      const borderHeader = {
        top: { style: "medium", color: { rgb: "FF666666" } },
        bottom: { style: "medium", color: { rgb: "FF666666" } },
        left: borderThin,
        right: borderThin
      };
      const range = xlsxLib.utils.decode_range(ws["!ref"]);

      for (let R = range.s.r; R <= range.e.r; R++) {
        for (let C = range.s.c; C <= range.e.c; C++) {
          const addr = xlsxLib.utils.encode_cell({ r: R, c: C });
          if (!ws[addr]) continue;

          const isHeader1 = R === headerRowIdx;
          const isHeader2 = R === headerRowIdx + 1;
          const isHeader = isHeader1 || isHeader2;
          const isTitle = R === 0;
          const isMeta = R === 1 || R === 2;
          const isCategory = boldRows.includes(R) && !isHeader && !isTitle && !isMeta;

          let cellStyle = {
            font: {
              name: fontName,
              sz: isTitle ? 14 : (isHeader ? 11 : (isCategory ? 11 : 10)),
              bold: isTitle || isHeader || isCategory,
              color: { rgb: isTitle ? "FF0B6E4F" : (isCategory ? "FF084C36" : (isMeta ? "FF555555" : "FF1A1A1A")) }
            },
            alignment: {
              vertical: "center",
              horizontal: isTitle || isMeta ? "left" : (isHeader || isTransform || C < 2 || C === 3 || C === 4 ? "center" : "left"),
              wrapText: true
            }
          };

          // Bordes para todas las celdas de la tabla
          if (!isTitle && !isMeta && R >= headerRowIdx) {
            cellStyle.border = isHeader ? borderHeader : borderCell;
          }

          // Encabezados con fondo gris suave y texto en negrita
          if (isHeader) {
            cellStyle.fill = { patternType: "solid", fgColor: { rgb: "FFEAEAEA" } };
            cellStyle.alignment = { vertical: "center", horizontal: "center", wrapText: true };
          }

          // Filas de categorías con fondo suave distinguido
          if (isCategory) {
            cellStyle.fill = { patternType: "solid", fgColor: { rgb: "FFE8F4EC" } };
            cellStyle.alignment = { vertical: "center", horizontal: "left", wrapText: true };
          }

          ws[addr].s = cellStyle;
        }
      }
    }

      // Manejador de Login con Protección de Ciberseguridad
      async function handleLogin(e) {
        if (e && e.preventDefault) e.preventDefault();
        const cleanUser = sanitizeUsername(loginUser);
        const cleanPass = String(loginPass || "");

        if (!cleanUser || !cleanPass) {
          setLoginError("Usuario o contraseña incorrectos.");
          return;
        }

        // 1. Verificar si la cuenta se encuentra bloqueada por exceso de intentos
        const lockStatus = await checkAccountLockout(cleanUser);
        if (lockStatus.locked) {
          setLoginError(`Cuenta bloqueada temporalmente por exceso de intentos fallidos. Intente nuevamente en ${lockStatus.remainingMinutes} min.`);
          return;
        }

        // 2. Búsqueda y verificación con hash criptográfico
        const found = users.find((u) => u.user === cleanUser);
        const isPasswordValid = found ? await verifyPassword(cleanPass, found.pass) : false;

        // 3. Fallo de autenticación: registrar intento y mostrar error genérico
        if (!found || !isPasswordValid) {
          const failResult = await recordFailedLoginAttempt(cleanUser);
          const currentSec = await getAuthSecurity();
          setAuthSecurityMap(currentSec);

          if (failResult.isNowLocked) {
            setLoginError(`Cuenta bloqueada temporalmente por exceso de intentos fallidos. Intente nuevamente en ${failResult.remainingMinutes} min.`);
          } else {
            // Mensaje de error estandarizado anti-enumeración
            setLoginError("Usuario o contraseña incorrectos.");
          }
          return;
        }

        // 4. Autenticación exitosa: limpiar intentos fallidos
        await clearLoginAttempts(cleanUser);
        const currentSec = await getAuthSecurity();
        setAuthSecurityMap(currentSec);
        setLoginError("");

        // Auto-migración a hash en caso de que el usuario tuviera contraseña en texto plano
        if (!found.pass.startsWith("$sha256$")) {
          const hashed = await hashPasswordWithSalt(cleanPass);
          const updatedUsers = users.map(u => u.user === cleanUser ? { ...u, pass: hashed } : u);
          setUsers(updatedUsers);
          await storageSet('aurora_users', updatedUsers);
        }

        setAuthedUser(found);
        await storageSet('aurora_session', { user: found.user });
        setEncargado(sanitizeText(found.name).toUpperCase());
        setCheckEvaluador(sanitizeText(found.name).toUpperCase());
        setScreen("hub");
      }

        const history = Array.isArray(previousHistory) ? previousHistory : [];

        if (existing && !forceOverwrite && !saveAsNew) {
          setOverwriteModalInfo({ existing, cleanFecha, cleanTitle });
          return false;
        }

        const now = Date.now();
        const dateStr = new Date(now).toLocaleDateString("es-PE", { day: "2-digit", month: "2-digit", year: "numeric" });
        const timeStr = new Date(now).toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true });
        const savedAtFormatted = `${dateStr} · ${timeStr}`;

        let generatedTitle = cleanTitle;
        if (saveAsNew && existing) {
          generatedTitle = (cleanTitle || `Guardado ${cleanFecha}`) + ` (${timeStr.slice(0, 5)})`;
        } else if (!generatedTitle) {
          generatedTitle = existing?.title || `Guardado ${dateStr}`;

        const snapshot = {
          id: existing && forceOverwrite ? (existing.id || `${cleanFecha}_${now}`) : `${cleanFecha}_${now}`,
          fecha: cleanFecha,
          encargado: cleanEncargado,
          createdBy: isEditing ? (existing.createdBy || existing.encargado || cleanEncargado) : cleanEncargado,
          createdAt: isEditing ? (existing.createdAt || existing.savedAt || now) : now,
          isEdited: isEditing,
          editedBy: isEditing ? cleanEncargado : (existing?.editedBy || null),
          editedAt: isEditing ? now : (existing?.editedAt || null),
          entries,
          savedAt: now,
          savedAtFormatted: savedAtFormatted,
          savedBy: cleanEncargado,
          title: generatedTitle,
          status: "ENVIADO"
        };

        const merged = await saveRequirementSnapshot(area, snapshot);
        setHistorySaves(merged);
        setCloudSyncStatus("connected");
        setLastSyncTime(new Date().toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit", second: "2-digit" }));

        setEntries({});

      function saveWorkbookXlsx(wb, filename) {
        try {
          const xlsxLib = getXLSXLib();
          if (!xlsxLib) {
            alert("La librería Excel (XLSX) no está disponible.");
            return;
          }
          const wbout = xlsxLib.write(wb, { bookType: "xlsx", type: "array", cellStyles: true });
          const blob = new Blob([wbout], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            if (document.body.contains(a)) document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }, 1000);
        } catch (err) {
          console.error("Error al exportar XLSX via Blob:", err);
          try {
            const xlsxLib = getXLSXLib();
            if (xlsxLib && xlsxLib.writeFile) {
              xlsxLib.writeFile(wb, filename, { cellStyles: true });
            } else {
              alert("Error al descargar el archivo Excel: " + (err.message || err));
            }
          } catch (e2) {
            alert("Error al descargar el archivo Excel: " + (err.message || err));
          }
        }
      }

        const cleanDraft = {
          ...draft,

      // ADMINISTRACION DE USUARIOS Y SEGURIDAD
      function startEditUser(u) {
        setEditingUser({ originalUser: u.user, user: u.user, pass: "", name: u.name, role: u.role });
        const formEl = document.getElementById("admin-user-card");
        if (formEl) formEl.scrollIntoView({ behavior: "smooth", block: "center" });

      async function handleSaveUser(e) {
        e.preventDefault();
        if (editingUser) {
          const cleanName = sanitizeText(editingUser.name, 80);
          const cleanUser = sanitizeUsername(editingUser.user);
          const cleanPass = String(editingUser.pass || "").trim();
          const cleanRole = editingUser.role === "admin" ? "admin" : "basico";

          if (!cleanName || !cleanUser) {
            alert("Por favor complete todos los campos obligatorios.");
            return;
          }

          if (cleanUser.length < 3) {
            alert("El nombre de usuario debe contener al menos 3 caracteres alfanuméricos válidos.");
            return;
          }

          if (cleanUser !== editingUser.originalUser && users.some(u => u.user === cleanUser)) {
            alert("El nombre de usuario ya se encuentra en uso por otra persona.");
            return;
          }

          const existing = users.find(u => u.user === editingUser.originalUser);
          let finalPass = existing ? existing.pass : "";
          if (cleanPass.length > 0) {
            if (cleanPass.length < 4) {
              alert("La nueva contraseña debe tener al menos 4 caracteres.");
              return;
            }
            finalPass = await hashPasswordWithSalt(cleanPass);
          }

          const updatedUsers = users.map(u => {
            if (u.user === editingUser.originalUser) {
              return { user: cleanUser, pass: finalPass, name: cleanName, role: cleanRole };
            }
            return u;
          });

          setUsers(updatedUsers);
          await storageSet('aurora_users', updatedUsers);

          // Si cambió el nombre de usuario, migrar su registro de intentos y seguridad
          if (cleanUser !== editingUser.originalUser) {
            const sec = await getAuthSecurity();
            if (sec[editingUser.originalUser]) {
              sec[cleanUser] = sec[editingUser.originalUser];
              delete sec[editingUser.originalUser];
              await saveAuthSecurity(sec);
              setAuthSecurityMap(sec);
            }
          }

          // Si el usuario editado es el que está en sesión, actualizar sesión activa
          if (authedUser?.user === editingUser.originalUser) {
            const updatedCurrent = { user: cleanUser, pass: finalPass, name: cleanName, role: cleanRole };
            setAuthedUser(updatedCurrent);
            await storageSet('aurora_session', { user: cleanUser });
            setEncargado(cleanName.toUpperCase());
            setCheckEvaluador(cleanName.toUpperCase());
          }

          setEditingUser(null);
        } else {
          const cleanName = sanitizeText(newUser.name, 80);
          const cleanUser = sanitizeUsername(newUser.user);
          const cleanPass = String(newUser.pass || "").trim();
          const cleanRole = newUser.role === "admin" ? "admin" : "basico";

          if (!cleanName || !cleanUser || !cleanPass) {
            alert("Por favor complete todos los campos obligatorios.");
            return;
          }

          if (cleanUser.length < 3) {
            alert("El nombre de usuario debe contener al menos 3 caracteres alfanuméricos válidos.");
            return;
          }

          if (cleanPass.length < 4) {
            alert("La contraseña debe tener al menos 4 caracteres.");
            return;
          }

          if (users.some((u) => u.user === cleanUser)) {
            alert("El nombre de usuario ya se encuentra registrado.");
            return;
          }

          const hashedPass = await hashPasswordWithSalt(cleanPass);
          const updatedUsers = [...users, { user: cleanUser, pass: hashedPass, name: cleanName, role: cleanRole }];
          setUsers(updatedUsers);
          await storageSet('aurora_users', updatedUsers);
          setNewUser({ user: "", pass: "", name: "", role: "basico" });
        }
      }

      async function handleDeleteUser(userToRemove) {
        if (userToRemove === authedUser?.user) {
          alert("No puedes eliminar tu propia cuenta en sesión.");
          return;
        }
        if (editingUser?.originalUser === userToRemove) {
          setEditingUser(null);
        }
        const confirmed = window.confirm(`¿Estás seguro de eliminar al usuario '${userToRemove}'?`);
        if (!confirmed) return;
        const updatedUsers = users.filter(u => u.user !== userToRemove);
        setUsers(updatedUsers);
        await storageSet('aurora_users', updatedUsers);
        await clearLoginAttempts(userToRemove);
        const currentSec = await getAuthSecurity();
        setAuthSecurityMap(currentSec);
      }

        await unlockUserAccount(userToUnlock);
        const currentSec = await getAuthSecurity();

        let currentCat = null;

          if (it.c !== currentCat) {

      // RECURSOS HUMANOS FUNCIONES
      async function uploadDoc(key, file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
          const docData = {
            filename: sanitizeText(file.name, 100),
            data: e.target.result,
            uploadedAt: Date.now(),
            uploadedBy: sanitizeText(authedUser?.name || "Admin", 80)
          };
          const updated = { ...rrhhDocs, [key]: docData };
          setRrhhDocs(updated);
          await storageSet('aurora_rrhh_docs', updated);
        };
        reader.readAsDataURL(file);
      }

      function downloadDoc(doc) {
        if (!doc || !doc.data) return;
        const a = document.createElement("a");
        a.href = doc.data;
        a.download = doc.filename || "documento";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
